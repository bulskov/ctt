name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job runs all three suites ctt registers at top level: the example,
# the self-tests, and (on POSIX) the behavior tests that compile crafted
# suites and check their output and exit codes.

jobs:
  # Two compilers, because a bug can be invisible under one of them.
  linux:
    name: linux (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

  # C99 is ctt's floor, and strict -std=c99 (no GNU extensions) is the mode
  # where ctt.h has to request the POSIX signal API itself.
  strict-c99:
    name: linux (strict c99)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_STANDARD=99 -DCMAKE_C_EXTENSIONS=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

  # ctt promises to be sanitizer-friendly; prove it on its own suites.
  asan:
    name: linux (asan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      # The runner kernel randomises 32 bits of mmap addresses; the sanitizer
      # runtimes assume fewer and abort with "unexpected memory mapping".
      - name: Reduce mmap randomisation for the sanitizers
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        env:
          CC: clang
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

  # MSVC itself and clang-cl, the two supported Windows toolchains.
  # msvc-dev-cmd puts the MSVC environment on PATH for Ninja.
  windows:
    name: windows (${{ matrix.cc }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [cl, clang-cl]
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=${{ matrix.cc }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

  macos:
    name: macos (clang)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: brew install ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
